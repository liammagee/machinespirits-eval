[mcp_servers.evaluations-db]
args = [
    "-y",
    "mcp-server-sqlite-npx",
    "data/evaluations.db",
]
command = "npx"

[mcp_servers.tutor-stub]
args = ["scripts/tutor-stub-mcp.js"]
command = "node"
required = false
tool_timeout_sec = 360

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
