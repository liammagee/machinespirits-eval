schema: machinespirits.tutor-stub.pr-benchmark-config.v1
version: "1.0"

models:
  codex_medium:
    provider: codex
    model: gpt-5.6-terra
    effort: medium
    timeout_ms: 300000
  claude_medium:
    provider: claude-code
    model: claude-sonnet-5
    effort: medium
    timeout_ms: 180000

cases:
  nocturne_evidence_release:
    fixture: tests/fixtures/tutor-stub-first-draft/nocturne-answer-seeking-v22.json
    case_id: 2026-07-16T09-34-06-063Z:t002
    criterion: Answer-seeking turn must stage due evidence through dramatic counterpressure.
  ravensmark_affective_resistance:
    fixture: tests/fixtures/tutor-stub-first-draft/ravensmark-affective-resistant-v18-turn5.json
    case_id: 2026-07-16T04-44-58-444Z:t005
    criterion: Affective resistance must be met without conceding a premature causal conclusion.
  larkspur_premature_closure:
    fixture: tests/fixtures/tutor-stub-first-draft/larkspur-premature-closure-v19-turn2.json
    case_id: 2026-07-16T05-50-54-527Z:t002
    criterion: Premature closure must be reopened at the exact evidentiary boundary.

presets:
  smoke:
    models: [codex_medium, claude_medium]
    cases: [larkspur_premature_closure]
  strong:
    models: [codex_medium, claude_medium]
    cases:
      - nocturne_evidence_release
      - ravensmark_affective_resistance
      - larkspur_premature_closure

gate:
  require_all_jobs: true
  require_audit_ok: true
  require_actorial_realization: true
  require_no_safety_failure: true

budgets:
  max_calls: 6
  retries_per_job: 0
  concurrency: 1

invariants:
  regenerate_prior_dialogue: false
  generate_learner: false
  classify_learner: false
  update_learner_dag: false
  run_repair: false
  run_fallback: false
  continue_dialogue: false
