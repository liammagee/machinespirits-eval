schema: machinespirits.tutor-stub.pr-benchmark-config.v1
version: "1.0"

rubric:
  path: config/tutor-pr-benchmark-rubric.yaml
  schema: machinespirits.tutor-stub.pr-benchmark-rubric.v1
  version: "1.0"

models:
  codex_medium:
    provider: codex
    model: gpt-5.6-terra
    effort: medium
    timeout_ms: 300000
  claude_medium:
    provider: claude-code
    model: claude-sonnet-5
    effort: medium
    timeout_ms: 180000

cases:
  nocturne_counterpressure_write:
    fixture: tests/fixtures/tutor-stub-first-draft/nocturne-answer-seeking-v22.json
    case_id: 2026-07-16T09-34-06-063Z:t007
    criterion: Answer-seeking must receive a writable evidentiary limit through visible dramatic counterpressure.
  nocturne_period_source:
    fixture: tests/fixtures/tutor-stub-first-draft/nocturne-answer-seeking-v22.json
    case_id: 2026-07-16T09-34-06-063Z:t009
    criterion: The newly licensed period must be stated directly without overclaiming authorship.
  nocturne_boundary_handoff:
    fixture: tests/fixtures/tutor-stub-first-draft/nocturne-answer-seeking-v22.json
    case_id: 2026-07-16T09-34-06-063Z:t010
    criterion: The settled date boundary must be preserved while handing off the next unresolved people question.

presets:
  smoke:
    models: [codex_medium, claude_medium]
    cases: [nocturne_period_source]
  strong:
    models: [codex_medium, claude_medium]
    cases:
      - nocturne_counterpressure_write
      - nocturne_period_source
      - nocturne_boundary_handoff

hook:
  preset: strong
  enforcement: report_only
  base_ref: origin/main
  report_scope: git_common
  report_root: machinespirits-reports/tutor-pr-benchmark
  import_roots:
    - scripts/run-tutor-pr-benchmark.js
  exact_paths:
    - config/providers.yaml
    - config/tutor-agents.yaml
    - config/tutor-pr-benchmark.yaml
    - config/tutor-pr-benchmark-rubric.yaml
    - config/tutor-pr-benchmark-calibration.yaml
    - scripts/run-tutor-pr-benchmark.js
    - scripts/tutor-pr-benchmark-hook.js
    - services/cliProviderBridge.js
    - services/tokenUsage.js
    - services/tutorStubCliArguments.js
    - services/tutorStubClarificationTranslationRuntime.js
    - services/tutorStubCharacterControlController.js
    - services/tutorStubCommandRuntime.js
    - services/tutorStubDebugReportRuntime.js
    - services/tutorStubFeedbackTuningController.js
    - services/tutorStubFrozenReplay.js
    - services/tutorStubInterimController.js
    - services/tutorStubInteractiveAutomationController.js
    - services/tutorStubInteractiveDialogueController.js
    - services/tutorStubInteractiveDirectorController.js
    - services/tutorStubInteractiveInputPresentation.js
    - services/tutorStubInteractiveLearnerRuntime.js
    - services/tutorStubInteractiveSessionController.js
    - services/tutorStubInteractiveTurnController.js
    - services/tutorStubLaunchRuntime.js
    - services/tutorStubLaunchSummaryPresentation.js
    - services/tutorStubLearnerAnalysisRuntime.js
    - services/tutorStubLearnerDagState.js
    - services/tutorStubLearnerEvidenceRuntime.js
    - services/tutorStubLiveSettingsController.js
    - services/tutorStubModelPickerController.js
    - services/tutorStubMixedLearnerController.js
    - services/tutorStubOpeningRuntime.js
    - services/tutorStubPerformanceControlController.js
    - services/tutorStubPromptTransport.js
    - services/tutorStubPrBenchmark.js
    - services/tutorStubPrBenchmarkHook.js
    - services/tutorStubPublicPresentationRuntime.js
    - services/tutorStubRecoveryAccountingRuntime.js
    - services/tutorStubResponsePolicy.js
    - services/tutorStubScenarioController.js
    - services/tutorStubSessionOrchestration.js
    - services/tutorStubSessionStateRuntime.js
    - services/tutorStubTraceRuntime.js
    - services/tutorStubTutorPromptContext.js
    - services/tutorStubTutorTurnPipeline.js
    - services/tutorStubTurnOrchestration.js
    - services/tutorStubVoiceController.js
    - services/tutorStubWorldPresentation.js
  path_prefixes:
    - config/drama-derivation/
    - prompts/
    - tests/fixtures/tutor-stub-first-draft/

gate:
  require_all_jobs: true
  require_audit_ok: true
  require_actorial_realization: false
  require_no_safety_failure: true

budgets:
  max_calls: 6
  retries_per_job: 0
  concurrency: 1

invariants:
  regenerate_prior_dialogue: false
  generate_learner: false
  classify_learner: false
  update_learner_dag: false
  run_repair: false
  run_fallback: false
  continue_dialogue: false
