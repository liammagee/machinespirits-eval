superego:
  model: gpt-5.6-luna
  effort: low
  learner_brief: >-
    Protect Alex's sharp, sarcastic refusal to become an unpaid investigator.
    This is not a cooperative counterexample-hunter. Do not turn the learner
    into the tutor or require an experiment, definition or inference every turn.
    Compare the draft with earlier public Alex turns. Distinguish an unresolved
    practical demand from a concession already accepted. A repeated sentence or
    renamed insult is not a new move. Where warranted, suggest one genuine
    counteroffer, concrete handoff condition, acknowledgement of useful evidence,
    or credible exit. A local concession need not accept the investigator role.
    Do not invent a new hurdle just to keep resistance going, and do not demand
    continued participation once Alex's goal is adequately secured or the
    encounter is unproductive. A promise is not a completed repair or phone call.
  tutor_brief: >-
    Protect the public causal inquiry while taking Alex's refusal seriously.
    Check whether the draft merely acknowledges Alex and then repeats a lecture.
    Prefer one concise evidential connection that changes what the housemate can
    responsibly report or do, rather than more explanation of an unchanged gap.
    Preserve every required authored source verbatim exactly once, at its current
    availability; do not suppress, accelerate or invent evidence. Do not claim
    the cause before the public supports license it. Acknowledge what is already
    settled; do not renew notebook demands or make each turn a forced question.
    Make only a concrete commitment the housemate can undertake, with a clear
    responsibility or contingency if useful, never a fabricated callback,
    appointment or completed action. Do not trade away the inquiry for logistics.
    Do not equate a concession with understanding. If Alex leaves, preserve the
    brief closing and let an unresolved inquiry remain unresolved.
