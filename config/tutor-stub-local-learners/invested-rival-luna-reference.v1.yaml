report:
  page_title: Invested rival theorist · Luna reference
  rail_title: Invested rival · reference
  headline: How does Luna play the same rival?
  subtitle: Normal Qwen · abliterated Qwen · Luna learner · Sol tutor · no superego
  interchange_label: Same invested-rival brief · three descriptive model instances
  setup_title: A post-hoc reference, not a third randomized arm
  setup_description: >-
    Luna receives the same Alex character, Rowan Flat opening, public proof
    schedule and Sol tutor mechanism. The two sealed Qwen dialogues and their
    Opus scores are reused byte-for-byte; only Luna is newly generated and
    assessed.
  setup_mechanism_description: >-
    One new Luna dialogue is added without a superego or revision call. The
    sealed Qwen conversations remain first and second in the display. All three
    use the same opening and public evidence schedule, with at most eight paired
    exchanges.
  quality_description: >-
    Semantic repetition means reopening the same answered challenge or making
    the same move in new words. A useful new move changes the tested inference,
    uses new public evidence, makes a real concession or names a different gap.
  comparison_description: >-
    The Luna conversation was added after the Qwen results were known. It is a
    descriptive reference for the acting task, not a preregistered causal arm,
    an abliteration estimate or a general model ranking.
  comparison_mechanism_description: >-
    The learner brief and Sol proof control are matched across all three
    conversations. Only Luna is newly generated; the Qwen conversations are
    immutable reference inputs.
  rubric_description: >-
    Opus applies the same v2.2 tutor, learner and dialogue rubrics plus the same
    acting-quality instrument. Character fidelity, pedagogy and nonrepetition
    remain separate.
  transcript_description: >-
    The fixed opening is not scored. Each conversation may end naturally before
    eight exchanges; missing later turns are not treated as missing evidence.
  proof_description: >-
    The deterministic harness releases the same authored public observations
    on the same schedule. Neither speaker sees hidden answers, proof paths or
    future evidence.
  scope_description: >-
    Three single free-running conversations are bounded private engineering
    evidence. They do not establish human learning, a general model ranking or
    a clean causal effect of model family or abliteration.
  speed_description: >-
    Every learner produces public speech plus a private continuity note in one
    pass. Qwen uses local MLX while Luna and Sol use Codex routes, so latency and
    throughput are descriptive only. Conversation and response lengths are not
    matched; lexical difference is auxiliary rather than semantic evidence.
