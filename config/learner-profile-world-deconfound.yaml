    status: approved_for_design
    approved_on: 2026-08-09
    source: user_directed_unblock
    change: >-
      Replace the irrecoverable historical-plus-crossed analysis with one
      prospective balanced 2x2 cohort: both personas in both worlds, five
      dialogues per cell. This changes the prospective paid scope from ten to
      twenty dialogues but does not authorize any call.
