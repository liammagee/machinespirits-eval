# WORLD-032 — the misconception world. Every prior world's learner holds a
# wrong *candidate*; this learner holds a wrong *theory*, and the world is
# built so the theory absorbs most of the evidence that supports the truth.
# One install changed two things at once — the pump arrived AND the overflow
# valve was re-set — so every fact about fullness has a pump re-reading until
# the breaker ledger closes that road. Closure by the strict reader should be
# reachable only if the tutor engages the theory itself: names the confound,
# lands the falsifier, and rebuilds the mechanism piece by piece. A tutor who
# only recites facts should leave the record-keeper vindicated and the
# dialogue open. Designed 2026-07-30 for the outcome-channel gate: the bare
# tutor runs first, and the world fails its purpose if bare closes reliably.

id: world_032_alder_row
title: The Split Tanks of Alder Row
discipline: "Practical mechanism reasoning (a garden-society repair dispute)"

question: "What has been splitting the water tanks at Alder Row?"
question_pattern: [causedTankSplits, alderRow, "?x"]

opening_frame:
  situation: >-
    Three more tanks split on the coldest morning of the winter, the society's
    new transfer pump is barely two months old, and the site ledger's margin
    already carries one word: pump.
  authored_text: >-
    Three more tanks have split along Alder Row, the new transfer pump hums two
    paces from the worst of them, and the ledger margin says what half the
    society is saying. What has been splitting the water tanks at Alder Row?
    Which observation should the ledger put beside that question first?

setting: >-
  Alder Row is a terrace garden above the canal: ten linked rainwater tanks on
  one supply line, a tool shed, and a society that votes on everything. Over
  the record-keeper's objection, the society bought a transfer pump at the
  start of winter; within days of its install the first tank split, and they
  have kept splitting on cold mornings since. The record-keeper would like the
  minutes to read "the pump did this" before the spring meeting. The site
  ledger's oldest rule is less obliging: write what was observed, follow the
  mechanism, and remember that a grievance is not a cause.

learner_voice: >-
  The society's record-keeper, who spoke against buying the pump and was
  outvoted. Every new split lands as vindication, and each fresh fact is read
  first as pump-evidence: what fits is absorbed, what almost fits is bent
  until it does. Moves only when a fact will not bend either way — and even
  then needs the true mechanism built piece by piece before writing it, since
  giving up the pump means giving up being right about the vote.

secret:
  fact: [causedTankSplits, alderRow, fullTankFreezing]
  # Deterministic backstop for the closure assertion, mirroring world-030's:
  # fires only once the record entails the secret, never on a question.
  recognition_patterns:
    - id: freeze_split_tanks
      all_of:
        - ["froze", "freez", "frost", "ice"]
        - ["full", "brim", "waterline", "standing water"]
        - ["split", "crack", "burst"]
      none_of:
        - "did not freeze"
        - "didn't freeze"
        - "not the frost"
        - "not the ice"
        - "rule out the frost"
        - "does not show"
        - "doesn't show"
        - "cannot conclude"
        - "can't conclude"
        - "not yet"
  surface: >-
    The tanks are being split by their own standing water freezing. Since the
    overflow valve was re-set during the pump install, the line stands
    brim-full overnight; on hard-frost nights the full tanks freeze at the brim
    and the ice splits them along the waterline — near the pump and far from
    it alike.

mirror:
  fact: [causedTankSplits, alderRow, pumpVibration]

rules:
  - id: R1_standing
    gloss: >-
      The line stands full overnight when the overflow valve is set above the
      draw line and the tanks refill by each evening.
    if:
      - [valveSetAbove, overflowValve, drawLine]
      - [refillsNightly, tankLine]
    then:
      - [standsFullOvernight, tankLine]
  - id: R2_freeze
    gloss: >-
      Tanks that stand full through a held hard frost freeze at the brim.
    if:
      - [standsFullOvernight, tankLine]
      - [hardFrostHeld, splitNights]
    then:
      - [frozeAtBrim, tankLine, splitNights]
  - id: R3_split
    gloss: >-
      Brim-ice caused the splits when the splits themselves run at the full
      waterline rather than anywhere else a different mechanism would mark.
    if:
      - [frozeAtBrim, tankLine, splitNights]
      - [splitsAtWaterline, alderTanks]
    then:
      - [causedTankSplits, alderRow, fullTankFreezing]
  - id: R4_vibration
    gloss: >-
      A machine's vibration caused the splits only if it transmits into the
      tank line and the splits sit where transmitted vibration works — at the
      mounts and frame bolts. Arrival timing without a matching mark is not
      enough.
    if:
      - [transmitsVibration, "?x", tankLine]
      - [splitsMatchMounts, "?x"]
    then:
      - [causedTankSplits, alderRow, "?x"]

premises:
  - id: p_install
    evidence_role: mirror
    fact: [transmitsVibration, transferPump, tankLine]
    surface: >-
      The transfer pump was installed in the first week of winter and its hum
      can be felt faintly through the shared frame; the first split followed
      within days, and the two tanks nearest the pump shed went first.
  - id: p_refill
    fact: [refillsNightly, tankLine]
    surface: >-
      The supply line tops the tanks up each evening after the troughs close;
      by dark the whole row reads the same level on the sight glass.
  - id: p_valve
    fact: [valveSetAbove, overflowValve, drawLine]
    surface: >-
      The install work order shows a second change made the same week the pump
      arrived: the overflow valve was re-set two hands above the old draw
      line, so the pump would always find water. Since that week the row
      stands brim-full overnight instead of drawing down.
  - id: p_frost
    fact: [hardFrostHeld, splitNights]
    surface: >-
      The site ledger pairs every split morning with a night the frost held
      past dawn. On mild nights there are no new splits — though the pump ran
      those nights the same as any other.
  - id: p_outage
    # Off the secret's proof path by design: it defeats the mirror rather than
    # advancing the derivation, which is what makes it the falsifier the
    # misconception cannot absorb.
    evidence_role: corroboration
    fact: [offDuring, transferPump, coldestWeek]
    surface: >-
      The breaker ledger shows the pump was shut down for impeller repair
      through the coldest week of the winter — zero run-hours logged — and
      three tanks split that same week.
  - id: p_waterline
    fact: [splitsAtWaterline, alderTanks]
    surface: >-
      Every split runs level at the brim-full waterline, on tanks near the
      pump and far from it alike, and not one crosses a mount or frame bolt.
      Tank nine, its float seized full, stood fullest and split worst — twenty
      paces from the pump.

background:
  - [keepsRecord, recordKeeper, siteLedger]

incompatible:
  - [[causedTankSplits, alderRow, fullTankFreezing], [causedTankSplits, alderRow, pumpVibration]]

proof_paths:
  - premises: [p_valve, p_refill, p_frost, p_waterline]

release_schedule:
  # Order carries the design: mirror fuel, then the confound (work order), then
  # the falsifier (breaker ledger), then the mechanism's last piece. The TURNS
  # are forced arithmetic, not taste. Four path premises must carry the proof
  # debt from 4 down to 0, the last one is pinned at t_min = 24, and both the
  # anti-aporia gates — this file's linter and the live detector in slope.js —
  # want every step under the 6-turn window. Four steps of 5 turns is the only
  # placement that fits, which is why the mirror opens at turn 4 rather than 2
  # and the debt falls on turns 9, 14, 19 and 24. Spreading the four evenly at
  # 6/6/6 satisfies the linter and plans a stall on turn 11. Do not widen a
  # step to make room for anything.
  - { turn: 4, premise: p_install, via: tutor }
  - { turn: 9, premise: p_refill, via: tutor }
  - turn: 14
    premise: p_valve
    via: director
    presentation: { mode: presented_exhibit, cue: "The install work order is unfolded on the shed bench, the valve line item circled." }
  - { turn: 19, premise: p_frost, via: tutor }
  - turn: 21
    premise: p_outage
    via: director
    presentation: { mode: enacted_role, role: society treasurer reading the breaker ledger aloud }
  - { turn: 24, premise: p_waterline, via: tutor }

dramaturgy:
  acts:
    - act: I
      title: The Petition Vindicated
      turns: [1, 9]
      intent: >-
        The pump's arrival and hum hand the record-keeper a theory that fits
        the calendar and the nearest cracked tanks. The tutor can feed facts
        without contest and watch each one absorbed as further vindication.
    - act: II
      title: One Week, Two Changes
      turns: [10, 19]
      intent: >-
        The work order splits the install into two simultaneous changes, and
        the frost ledger picks out cold nights rather than run-hours. The
        theory can still bend both facts; the question is whether the tutor
        makes the confound itself the object of the lesson.
    - act: III
      title: The Cold Ledger
      turns: [20, 40]
      intent: >-
        The breaker record removes the pump from the coldest week entirely,
        and the waterline pattern says what the ice did. Closure requires the
        record-keeper to assert the freeze mechanism grounded in the traced
        premises — not merely to stop defending the pump.

slope:
  t_min: 24
  aporia_window: 6

turn_cap: 40

motivation:
  learner:
    first_order:
      end: question_pattern
      opens_on: pumpVibration
      mirror_pull: high
    second_order:
      from: plotSociety
      as: right
      authority: rational_legal
    disposition:
      overreach: high
      arc: softens # only when a fact will not bend; being right about the vote is what is given up
  tutor:
    stance: >-
      The quiet neighbour who winters machinery for a living: respectful of
      the record-keeper's diligence, uninterested in the vote, and patient
      enough to let the ledger's own pairings — cold nights, still pumps,
      level splits — say what the ice did.

presentation:
  family: alder-row
  temporal_frame: contemporary
  scene_ecology: "terrace allotment garden in winter"
  narrative_diction: "practical committee-minutes plainspoken"
  ledger_term: site ledger
  summary: A garden-society dispute where the obvious culprit arrived the same week the real mechanism was created, and the ledger must tell one install's two changes apart.
