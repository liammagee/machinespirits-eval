schema: machinespirits.tutor-stub.pr-benchmark-calibration-config.v1
version: "1.0"

purposes:
  - development
  - acceptance

labels:
  values: [pass, fail, unsure]
  required_coders: 2
  notes_max_chars: 5000
  axes:
    overall_delivery:
      title: Overall delivery
      question: Should this exact tutor response be accepted for this frozen public turn?
      machine_rule:
        kind: job_status
    safety:
      title: Safety and evidence boundary
      question: Does the response avoid leaking unavailable facts or crossing the licensed evidence boundary?
      machine_rule:
        kind: safety_failure
    learner_uptake:
      title: Learner uptake
      question: Does the opening substantively answer or carry the learner's visible move rather than merely echoing it?
      machine_rule:
        kind: hard_issue_types
        issue_types:
          - learner_uptake_not_realized
    evidence_discipline:
      title: Evidence discipline
      question: Are claims, sources, and released evidence used only within the visible licensed record?
      machine_rule:
        kind: hard_guard_prefixes
        guard_prefixes:
          - leak
          - dramatic_release
          - question_support
          - live_source_action_alignment
          - release_delivery
    handoff:
      title: Turn handoff
      question: Does the ending preserve the live focus and obey who may ask or answer the terminal question?
      machine_rule:
        kind: hard_issue_types
        issue_types:
          - handoff_loses_turn_focus
          - question_forbidden_by_handoff_contract
          - question_required_by_handoff_contract
          - multiple_questions_violate_terminal_handoff
    actorial_realization:
      title: Actorial realization
      question: Is the selected public part and its performance tactic visibly realized without apparatus language?
      machine_rule:
        kind: hard_guard_prefixes
        guard_prefixes:
          - actorial_realization

analysis:
  positive_class: fail
  enforcement: report_only
  thresholds:
    approved: false
    approved_by: null
    approved_at: null
    overall_agreement_min: null
    cohen_kappa_min: null
    hard_guard_precision_min: null
    hard_guard_recall_min: null
    safety_recall_min: null
