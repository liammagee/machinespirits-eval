name: Tutor-stub surface acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tutor-stub-surface-acceptance.yml"
      - "fixtures/tutor-stub-surface-acceptance/**"
      - "package.json"
      - "package-lock.json"
      - "public/tutor/**"
      - "routes/tutorStubSessionRoutes.js"
      - "scripts/run-tutor-stub-surface-acceptance.mjs"
      - "scripts/tutor-stub-surface-acceptance-scenario.mjs"
      - "scripts/tutor-stub-acceptance-server.mjs"
      - "scripts/tutor-stub-surface-ci-policy.js"
      - "scripts/tutor-stub.js"
      - "services/cliProviderBridge.js"
      - "services/evalSurfaces.js"
      - "services/tutorStubProcessSessionFactory.js"
      - "services/tutorStubSessionHost.js"
      - "services/tutorStubSurfaceAcceptanceContract.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/tutor-stub-surface-acceptance.yml"
      - "fixtures/tutor-stub-surface-acceptance/**"
      - "package.json"
      - "package-lock.json"
      - "public/tutor/**"
      - "routes/tutorStubSessionRoutes.js"
      - "scripts/run-tutor-stub-surface-acceptance.mjs"
      - "scripts/tutor-stub-surface-acceptance-scenario.mjs"
      - "scripts/tutor-stub-acceptance-server.mjs"
      - "scripts/tutor-stub-surface-ci-policy.js"
      - "scripts/tutor-stub.js"
      - "services/cliProviderBridge.js"
      - "services/evalSurfaces.js"
      - "services/tutorStubProcessSessionFactory.js"
      - "services/tutorStubSessionHost.js"
      - "services/tutorStubSurfaceAcceptanceContract.js"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify browser-surface impact
    runs-on: ubuntu-latest
    outputs:
      surface_required: ${{ steps.manual.outputs.surface_required || steps.changes.outputs.surface_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Force acceptance for manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "surface_required=true" >> "$GITHUB_OUTPUT"

      - name: Classify changed surface boundaries
        id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/tutor-stub-surface-ci-policy.js
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  browser-surface:
    name: Browser tutor surface
    needs: classify
    if: needs.classify.outputs.surface_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Exercise the real shared web tutor surface
        run: npm run tutor:stub:acceptance:web

      - name: Upload browser traces, screenshots, exports, and host logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tutor-stub-surface-acceptance
          path: .test-tmp/tutor-stub-surface-acceptance
          if-no-files-found: error
