name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-contract:
    name: Hermetic test contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the required test inventory
        run: npm run test:manifest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Fetch managed archive branches and tags
        run: >-
          git fetch origin
          '+refs/heads/archive/*:refs/remotes/origin/archive/*'
          '+refs/tags/*:refs/tags/*'
          --prune

      - name: Validate ref and version registry
        run: npm run refs:check

      - run: npm run lint
      - run: npm run lint:cycles
      - run: npm run format:check

  test:
    needs: test-contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run root test shard ${{ matrix.shard }}/2
        run: npm run test:root -- --shard=${{ matrix.shard }}/2 --quiet

      - name: Run the in-housed tutor-core suite once per Node version
        if: matrix.shard == 1
        run: npm run test:core -- --quiet

  pty-concurrency:
    name: PTY / loopback concurrency
    needs: test-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Run the concurrent terminal lane without forced exit
        run: npm run test:pty:ci

  risk-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run test:coverage:risk

      - name: Upload risk coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-coverage
          path: coverage/risk
          if-no-files-found: error
