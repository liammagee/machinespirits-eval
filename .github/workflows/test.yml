name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify CI impact
    runs-on: ubuntu-latest
    outputs:
      full_required: ${{ steps.manual.outputs.full_required || steps.changes.outputs.full_required }}
      profile: ${{ steps.manual.outputs.profile || steps.changes.outputs.profile }}
      ref_governance_required: ${{ steps.manual.outputs.ref_governance_required || steps.main.outputs.ref_governance_required || steps.changes.outputs.ref_governance_required }}
      validator_required: ${{ steps.manual.outputs.validator_required || steps.changes.outputs.validator_required }}
      validator_tests: ${{ steps.changes.outputs.validator_tests }}
      validator_paths: ${{ steps.changes.outputs.validator_paths }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Force full CI for manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "profile=full" >> "$GITHUB_OUTPUT"
          echo "full_required=true" >> "$GITHUB_OUTPUT"
          echo "ref_governance_required=true" >> "$GITHUB_OUTPUT"
          echo "validator_required=false" >> "$GITHUB_OUTPUT"

      - name: Require ref governance after main integration
        id: main
        if: github.event_name == 'push'
        run: echo "ref_governance_required=true" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/ci-change-policy.js
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  test-contract:
    name: Hermetic test contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate dependency bootstrap ordering
        run: >-
          node --test
          --test-name-pattern='test-contract installs dependencies before every dependency-bearing bootstrap check'
          tests/ciChangePolicy.test.js

      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - name: Check the required test inventory
        run: npm run test:manifest

      - name: Reject skill-local tool preapprovals
        run: npm run skills:permissions:check

      - name: Exercise the classifier bootstrap contract
        run: node --test tests/ciChangePolicy.test.js tests/localCiRunner.test.js

  focused:
    name: Focused authored-metadata checks
    needs: [classify, test-contract]
    if: needs.classify.outputs.profile == 'focused'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate the allowlisted change set and changed JSON
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/ci-change-policy.js
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --validate-focused

  validator-only:
    name: Focused validator checks
    needs: [classify, test-contract]
    if: needs.classify.outputs.validator_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate the exact allowlisted change set and changed JSON
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/ci-change-policy.js
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --validate-focused

      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - name: Run the registered validator contract
        env:
          VALIDATOR_TESTS: ${{ needs.classify.outputs.validator_tests }}
        run: node --test $VALIDATOR_TESTS

      - name: Lint and format the registered validator paths
        env:
          VALIDATOR_PATHS: ${{ needs.classify.outputs.validator_paths }}
        run: |
          ./node_modules/.bin/eslint $VALIDATOR_PATHS
          ./node_modules/.bin/prettier --check $VALIDATOR_PATHS

  ref-governance:
    name: Ref governance
    needs: [classify, test-contract]
    if: needs.classify.outputs.ref_governance_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch managed archive branches and tags
        run: >-
          git fetch origin
          '+refs/heads/archive/*:refs/remotes/origin/archive/*'
          '+refs/tags/*:refs/tags/*'
          --prune

      - name: Validate ref and version registry
        run: npm run refs:check

  lint:
    needs: [classify, test-contract]
    if: needs.classify.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # node-pty compiles from source and better-sqlite3 fetches a prebuilt
      # binary; the setup-node cache covers neither, so cache the built tree.
      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - run: npm run lint
      # tutor-core/ keeps its own lint and format policy so the module stays
      # re-extractable; the root config ignores it, so it needs its own step.
      - run: npm run lint:tutor-core
      - run: npm run lint:cycles
      - run: npm run format:check
      - run: npm run format:check:tutor-core

  test:
    # The hermetic runner re-checks the test manifest itself, so this lane
    # starts without waiting for test-contract; `result` still requires it.
    needs: [classify]
    if: needs.classify.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      # node-pty compiles from source and better-sqlite3 fetches a prebuilt
      # binary; the setup-node cache covers neither, so cache the built tree.
      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - name: Run root test shard ${{ matrix.shard }}/4
        run: npm run test:root -- --shard=${{ matrix.shard }}/4 --quiet

      - name: Run the in-housed tutor-core suite once per Node version
        if: matrix.shard == 1
        run: npm run test:core -- --quiet

  pty-concurrency:
    name: PTY / loopback concurrency
    needs: [classify, test-contract]
    if: needs.classify.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # node-pty compiles from source and better-sqlite3 fetches a prebuilt
      # binary; the setup-node cache covers neither, so cache the built tree.
      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - name: Run the concurrent terminal lane without forced exit
        run: npm run test:pty:ci

      - name: Run the focused lifecycle lane without forced exit
        run: npm run test:lifecycle:ci

  risk-coverage:
    needs: [classify, test-contract]
    if: needs.classify.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # node-pty compiles from source and better-sqlite3 fetches a prebuilt
      # binary; the setup-node cache covers neither, so cache the built tree.
      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - run: npm run test:coverage:risk

      - name: Upload risk coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-coverage
          path: coverage/risk
          if-no-files-found: error

  result:
    name: CI result
    if: always()
    needs: [classify, test-contract, focused, validator-only, ref-governance, lint, test, pty-concurrency, risk-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected lane to pass
        env:
          PROFILE: ${{ needs.classify.outputs.profile }}
          FULL_REQUIRED: ${{ needs.classify.outputs.full_required }}
          REF_GOVERNANCE_REQUIRED: ${{ needs.classify.outputs.ref_governance_required }}
          VALIDATOR_REQUIRED: ${{ needs.classify.outputs.validator_required }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          CONTRACT_RESULT: ${{ needs.test-contract.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          VALIDATOR_RESULT: ${{ needs.validator-only.result }}
          REF_GOVERNANCE_RESULT: ${{ needs.ref-governance.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PTY_RESULT: ${{ needs.pty-concurrency.result }}
          COVERAGE_RESULT: ${{ needs.risk-coverage.result }}
        run: |
          failures=0
          require_result() {
            if [ "$1" != "$2" ]; then
              echo "$3: expected $2, got ${1:-<missing>}" >&2
              failures=$((failures + 1))
            fi
          }

          echo "CI lane conclusions:"
          printf '%-22s %s\n' \
            classifier "${CLASSIFY_RESULT:-<missing>}" \
            test-contract "${CONTRACT_RESULT:-<missing>}" \
            focused "${FOCUSED_RESULT:-<missing>}" \
            validator-only "${VALIDATOR_RESULT:-<missing>}" \
            ref-governance "${REF_GOVERNANCE_RESULT:-<missing>}" \
            lint "${LINT_RESULT:-<missing>}" \
            test "${TEST_RESULT:-<missing>}" \
            pty-concurrency "${PTY_RESULT:-<missing>}" \
            risk-coverage "${COVERAGE_RESULT:-<missing>}"

          require_result "$CLASSIFY_RESULT" success "classifier"
          require_result "$CONTRACT_RESULT" success "test contract"

          case "$REF_GOVERNANCE_REQUIRED:$REF_GOVERNANCE_RESULT" in
            true:success|false:skipped) ;;
            *)
              echo "ref governance: required=${REF_GOVERNANCE_REQUIRED:-<missing>} result=${REF_GOVERNANCE_RESULT:-<missing>}" >&2
              failures=$((failures + 1))
              ;;
          esac

          case "$PROFILE:$FULL_REQUIRED:$VALIDATOR_REQUIRED" in
            full:true:false)
              require_result "$FOCUSED_RESULT" skipped "focused lane"
              require_result "$VALIDATOR_RESULT" skipped "validator lane"
              require_result "$LINT_RESULT" success "lint lane"
              require_result "$TEST_RESULT" success "test lane"
              require_result "$PTY_RESULT" success "PTY lane"
              require_result "$COVERAGE_RESULT" success "coverage lane"
              ;;
            focused:false:false)
              require_result "$FOCUSED_RESULT" success "focused lane"
              require_result "$VALIDATOR_RESULT" skipped "validator lane"
              require_result "$LINT_RESULT" skipped "lint lane"
              require_result "$TEST_RESULT" skipped "test lane"
              require_result "$PTY_RESULT" skipped "PTY lane"
              require_result "$COVERAGE_RESULT" skipped "coverage lane"
              ;;
            validator-only:false:true)
              require_result "$FOCUSED_RESULT" skipped "focused lane"
              require_result "$VALIDATOR_RESULT" success "validator lane"
              require_result "$LINT_RESULT" skipped "lint lane"
              require_result "$TEST_RESULT" skipped "test lane"
              require_result "$PTY_RESULT" skipped "PTY lane"
              require_result "$COVERAGE_RESULT" skipped "coverage lane"
              ;;
            *)
              echo "Invalid CI classifier outputs: profile=${PROFILE:-<missing>} full_required=${FULL_REQUIRED:-<missing>} validator_required=${VALIDATOR_REQUIRED:-<missing>}" >&2
              failures=$((failures + 1))
              ;;
          esac

          if [ "$failures" -ne 0 ]; then
            echo "CI result: $failures lane contract mismatch(es)" >&2
            exit 1
          fi
