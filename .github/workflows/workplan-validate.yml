name: Workplan validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - '.github/pull_request_template.md'
      - '.github/workflows/workplan-*.yml'
      - 'package.json'
      - 'scripts/check-pr-workplan-link.js'
      - 'scripts/workplan-github-mirror.js'
      - 'scripts/workplan.js'
      - 'tests/workplan.test.js'
      - 'workplan/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Workplan tooling only imports yaml; avoid building native deps here.
      - name: Install yaml
        run: npm install --no-save yaml

      - name: Validate workplan source
        run: npm run wp:source-check

      - name: Keep feature PRs source-only
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKPLAN_ALLOW_GENERATED_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'workplan-generated-update') }}
        run: npm run wp:generated-pr-check

      - name: Workplan unit tests
        run: npm run wp:test

      - name: PR links back to workplan
        if: github.event_name == 'pull_request'
        run: npm run wp:pr-link
