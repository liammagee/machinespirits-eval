name: Workplan validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    paths:
      - '.github/pull_request_template.md'
      - '.github/workflows/workplan-*.yml'
      - 'package.json'
      - 'scripts/check-pr-workplan-link.js'
      - 'scripts/workplan-github-mirror.js'
      - 'scripts/workplan.js'
      - 'tests/workplan.test.js'
      - 'workplan/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # 'npm install --no-save yaml' installed the whole lockfile tree and
      # compiled node-pty. Restore the built tree instead; npm ci only on a miss.
      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - name: Validate workplan source
        run: npm run wp:source-check

      - name: Keep derived workplan views untracked
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run wp:generated-pr-check

      - name: Workplan unit tests
        run: npm run wp:test

      - name: PR links back to workplan
        if: github.event_name == 'pull_request'
        run: npm run wp:pr-link
