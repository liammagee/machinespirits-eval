name: Workplan GitHub mirror

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Create/update GitHub issues instead of dry-running'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      statuses:
        description: 'Comma-separated item statuses to mirror'
        required: true
        default: 'active,blocked'
      close_stale:
        description: 'Close mirrored issues whose items left the selected statuses'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  issues: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 'npm install --no-save yaml' installed the whole lockfile tree and
      # compiled node-pty. Restore the built tree instead; npm ci only on a miss.
      - name: Restore built dependencies
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'

      - name: Mirror workplan items to GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--status "${{ inputs.statuses }}")
          if [[ "${{ inputs.apply }}" == "true" ]]; then
            args+=(--apply)
          fi
          if [[ "${{ inputs.close_stale }}" == "true" ]]; then
            args+=(--close-stale)
          fi
          node scripts/workplan-github-mirror.js "${args[@]}"
