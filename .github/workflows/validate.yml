name: Validation Framework

# Runs the repo's data-independent validation framework: content-package validation
# and the provable-discourse paper-claim smoke validator. Unit coverage for the
# validator and ontology already runs in both Node versions through test.yml.
# These checks need no private DB / logs / API keys, so they run cleanly in CI.
#
# NOT run here (by design): the DB-backed validators — `provenance:validate`,
# `audit:message-chain`, `validate-paper-manifest` — which require the private
# `data/evaluations.db` (gitignored, symlinked locally); run those locally with
# `npm run provenance:validate` etc. Code-quality (`lint`, `format:check`) and the
# full test suite live in test.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify validation impact
    runs-on: ubuntu-latest
    outputs:
      validation_required: ${{ steps.manual.outputs.validation_required || steps.changes.outputs.validation_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Force validation for manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "validation_required=true" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/ci-change-policy.js
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  validate:
    name: Validation framework (CI-safe checks)
    needs: classify
    if: needs.classify.outputs.validation_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Content-package validation
        run: npm run content:validate

      - name: Paper claim validation — provable discourse (smoke)
        run: npm run paper:provable-discourse:smoke

  result:
    name: Validation result
    if: always()
    needs: [classify, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected validation to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$CLASSIFY_RESULT" = "success"
          case "$VALIDATE_RESULT" in
            success|skipped) ;;
            *) echo "Selected validation lane did not pass: $VALIDATE_RESULT" >&2; exit 1 ;;
          esac
